[package]
name = "pulse"
version = "0.1.0"
edition = "2021"
description = "Pulse — adaptive risk & continuous access engine for the Steadholme stack."
license = "MIT OR Apache-2.0"

[lib]
name = "pulse"
path = "src/lib.rs"

[[bin]]
name = "pulse"
path = "src/main.rs"

[dependencies]
# Vendored Odyssey canonical CSS (font + tokens + shared components) for server-rendered pages.
odyssey = { path = "crates/odyssey" }
# HTTP framework (shared with keystone/inkwell/relay): State/Path/Json/Form extractors, server
# -rendered HTML for the SSO dashboard, typed JSON for the /api/score endpoint.
axum = "0.8"
# Async runtime axum runs on. The Store trait is async: handlers `.await` it directly and PgStore
# drives sqlx natively, so a worker thread is NEVER blocked (no sync-over-async bridge). `time` is
# enabled for the background poller's interval timer.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (the estate seam).
async-trait = "0.1"
# Deserialize the Watchtower event feed + the /api/score request body; serialize the score
# response and the audit/klaxon payloads.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error enums -> HTML page (dashboard) / JSON error envelope (/api).
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for timestamps + the event hour-of-day used in scoring (std only, no C
# deps). Same crate the rest of the estate pins.
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG bytes for the double-submit CSRF token. Tiny libc-backed shim; `hex` encodes it.
getrandom = "0.2"
hex = "0.4"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time macros,
# so the build needs NO database. rustls TLS (no openssl). Standard SQL only, so the same
# statements later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
